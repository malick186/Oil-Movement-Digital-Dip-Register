name: Build Windows .exe

on:
  push:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci
        working-directory: tank-farm-dip-control

      - name: Build Tauri .exe
        run: npx tauri build
        working-directory: tank-farm-dip-control

      - name: Upload portable .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankFarmDipControl-Portable
          path: tank-farm-dip-control/src-tauri/target/release/tank-farm-dip-control.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tank-farm-dip-control/src-tauri/target/release/tank-farm-dip-control.exe
          generate_release_notes: true
